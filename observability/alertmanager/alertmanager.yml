global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers:
        - severity="critical"
      receiver: "critical"
      repeat_interval: 30m

receivers:
  - name: "default"
    # Swap for a real webhook/Slack/PagerDuty receiver in production.
    webhook_configs:
      - url: "http://localhost:5001/dev-null"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://localhost:5001/dev-null"
        send_resolved: true

inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["alertname"]
