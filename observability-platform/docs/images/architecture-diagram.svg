<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#0f172a"/>
  <text x="450" y="34" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">Observability Stack — Architecture</text>

  <!-- Application -->
  <rect x="370" y="60" width="160" height="60" rx="10" fill="#1d4ed8"/>
  <text x="450" y="95" text-anchor="middle" fill="white" font-size="14" font-weight="600">Application</text>

  <!-- three arrows: metrics, logs, traces -->
  <line x1="410" y1="120" x2="160" y2="200" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="155" fill="#86efac" font-size="12">metrics</text>

  <line x1="450" y1="120" x2="450" y2="200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="160" fill="#fcd34d" font-size="12">logs</text>

  <line x1="490" y1="120" x2="740" y2="200" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="155" fill="#c4b5fd" font-size="12">traces</text>

  <!-- Prometheus -->
  <rect x="60" y="210" width="200" height="60" rx="10" fill="#166534"/>
  <text x="160" y="238" text-anchor="middle" fill="white" font-size="14" font-weight="600">Prometheus</text>
  <text x="160" y="256" text-anchor="middle" fill="#bbf7d0" font-size="10">+ node-exporter, cAdvisor, postgres-exporter</text>

  <!-- Loki -->
  <rect x="350" y="210" width="200" height="60" rx="10" fill="#92400e"/>
  <text x="450" y="238" text-anchor="middle" fill="white" font-size="14" font-weight="600">Loki (via Promtail)</text>
  <text x="450" y="256" text-anchor="middle" fill="#fde68a" font-size="10">structured JSON logs, tagged with trace_id</text>

  <!-- OpenTelemetry -->
  <rect x="640" y="210" width="200" height="60" rx="10" fill="#5b21b6"/>
  <text x="740" y="238" text-anchor="middle" fill="white" font-size="14" font-weight="600">OpenTelemetry Collector</text>
  <text x="740" y="256" text-anchor="middle" fill="#ddd6fe" font-size="10">OTLP receiver → Tempo</text>

  <line x1="740" y1="270" x2="740" y2="320" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="640" y="325" width="200" height="50" rx="10" fill="#4c1d95"/>
  <text x="740" y="355" text-anchor="middle" fill="white" font-size="13" font-weight="600">Tempo (trace storage)</text>

  <!-- Alertmanager -->
  <rect x="60" y="325" width="200" height="50" rx="10" fill="#7f1d1d"/>
  <text x="160" y="349" text-anchor="middle" fill="white" font-size="12" font-weight="600">Alertmanager</text>
  <text x="160" y="364" text-anchor="middle" fill="#fecaca" font-size="9">HTTP 5xx, latency, CPU, disk, DB, restarts</text>
  <line x1="160" y1="270" x2="160" y2="325" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Grafana -->
  <rect x="300" y="430" width="300" height="70" rx="12" fill="#f97316"/>
  <text x="450" y="462" text-anchor="middle" fill="white" font-size="16" font-weight="700">Grafana</text>
  <text x="450" y="482" text-anchor="middle" fill="#ffedd5" font-size="11">RED dashboard · USE dashboard · trace↔log↔metric correlation</text>

  <line x1="160" y1="270" x2="380" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="270" x2="450" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="375" x2="520" y2="430" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="560" text-anchor="middle" fill="#94a3b8" font-size="12">
    RED = Rate · Errors · Duration (application, request-level)
  </text>
  <text x="450" y="582" text-anchor="middle" fill="#94a3b8" font-size="12">
    USE = Utilization · Saturation · Errors (CPU, memory, disk, network, DB pool, container restarts)
  </text>
</svg>
