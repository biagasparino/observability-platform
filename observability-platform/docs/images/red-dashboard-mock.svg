<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#111217"/>
  <rect x="0" y="0" width="900" height="40" fill="#181b1f"/>
  <circle cx="20" cy="20" r="6" fill="#f97316"/>
  <text x="36" y="25" fill="#e5e7eb" font-size="13" font-weight="600">Application — RED (Rate, Errors, Duration)</text>
  <text x="860" y="25" fill="#9ca3af" font-size="11" text-anchor="end">Last 30 minutes</text>

  <!-- Rate panel -->
  <rect x="16" y="56" width="424" height="180" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="30" y="76" fill="#d1d5db" font-size="12" font-weight="600">Rate — requests/sec</text>
  <polyline points="30,190 90,180 150,185 210,178 270,182 330,120 390,95 420,90" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <text x="390" y="80" fill="#22c55e" font-size="10">↑ traffic increasing</text>

  <!-- Errors panel -->
  <rect x="460" y="56" width="424" height="180" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="474" y="76" fill="#d1d5db" font-size="12" font-weight="600">Errors — HTTP 5xx rate (%)</text>
  <polyline points="474,215 534,214 594,213 654,214 714,120 774,60 834,55" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <text x="714" y="105" fill="#ef4444" font-size="10">⚠ spike at 14:32</text>

  <!-- Duration panel -->
  <rect x="16" y="250" width="424" height="180" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="30" y="270" fill="#d1d5db" font-size="12" font-weight="600">Duration — p50 / p95 / p99</text>
  <polyline points="30,400 90,398 150,396 210,395 270,250 330,120 390,95 420,90" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <polyline points="30,405 90,404 150,403 210,402 270,300 330,220 390,180 420,170" fill="none" stroke="#60a5fa" stroke-width="2"/>
  <polyline points="30,408 90,407 150,406 210,406 270,360 330,320 390,300 420,290" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="270" y="245" fill="#a78bfa" font-size="10">p99 climbing sharply</text>

  <!-- Status breakdown panel -->
  <rect x="460" y="250" width="424" height="180" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="474" y="270" fill="#d1d5db" font-size="12" font-weight="600">Status code breakdown</text>
  <rect x="474" y="380" width="340" height="14" fill="#22c55e"/>
  <rect x="474" y="396" width="200" height="14" fill="#3b82f6"/>
  <rect x="474" y="412" width="90" height="14" fill="#ef4444"/>
  <text x="820" y="391" fill="#9ca3af" font-size="10">2xx</text>
  <text x="680" y="407" fill="#9ca3af" font-size="10">3xx/4xx</text>
  <text x="570" y="423" fill="#9ca3af" font-size="10">5xx ↑</text>
</svg>
