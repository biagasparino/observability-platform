<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="460" fill="#111217"/>
  <rect x="0" y="0" width="900" height="40" fill="#181b1f"/>
  <circle cx="20" cy="20" r="6" fill="#3b82f6"/>
  <text x="36" y="25" fill="#e5e7eb" font-size="13" font-weight="600">Infrastructure — USE (Utilization, Saturation, Errors)</text>
  <text x="860" y="25" fill="#9ca3af" font-size="11" text-anchor="end">Last 30 minutes</text>

  <!-- CPU -->
  <rect x="16" y="56" width="280" height="150" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="28" y="74" fill="#d1d5db" font-size="11" font-weight="600">CPU — Utilization (%)</text>
  <polyline points="28,180 78,175 128,170 178,110 228,90 278,85" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- Memory -->
  <rect x="310" y="56" width="280" height="150" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="322" y="74" fill="#d1d5db" font-size="11" font-weight="600">Memory — Utilization (%)</text>
  <polyline points="322,160 372,158 422,155 472,150 522,148 572,145" fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Disk -->
  <rect x="604" y="56" width="280" height="150" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="616" y="74" fill="#d1d5db" font-size="11" font-weight="600">Disk — Utilization (%)</text>
  <polyline points="616,180 666,179 716,178 766,177 816,176 866,175" fill="none" stroke="#60a5fa" stroke-width="2.5"/>

  <!-- Network -->
  <rect x="16" y="222" width="280" height="150" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="28" y="240" fill="#d1d5db" font-size="11" font-weight="600">Network — throughput</text>
  <polyline points="28,340 78,330 128,335 178,320 228,300 278,310" fill="none" stroke="#22d3ee" stroke-width="2.5"/>

  <!-- DB pool (highlighted incident) -->
  <rect x="310" y="222" width="280" height="150" rx="6" fill="#181b1f" stroke="#ef4444" stroke-width="1.5"/>
  <text x="322" y="240" fill="#d1d5db" font-size="11" font-weight="600">Database — connection pool</text>
  <polyline points="322,350 372,340 422,300 472,240 522,195 572,180" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <line x1="322" y1="175" x2="572" y2="175" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="190" fill="#ef4444" font-size="10">in use → approaching max</text>

  <!-- Container restarts -->
  <rect x="604" y="222" width="280" height="150" rx="6" fill="#181b1f" stroke="#2c2f36"/>
  <text x="616" y="240" fill="#d1d5db" font-size="11" font-weight="600">Container restarts</text>
  <rect x="700" y="330" width="14" height="30" fill="#f59e0b"/>
  <rect x="760" y="310" width="14" height="50" fill="#f59e0b"/>
  <text x="616" y="360" fill="#9ca3af" font-size="10">flat, then 2 restarts observed</text>

  <rect x="16" y="390" width="868" height="46" rx="6" fill="#1f1410" stroke="#7c2d12"/>
  <text x="30" y="418" fill="#fca5a5" font-size="12">⚠ DBConnectionPoolSaturated firing — connection pool above 80% utilization</text>
</svg>
